# Gruvbox light256 theme (paired with github_light alacritty)
# Mirrors gruvbox-dark256.conf with inverted greys and accents tuned for white backgrounds.

# --- Status bar ---
set-option -gq status "on"
set-option -gq status-style "bg=default,fg=colour237"
set-option -gq status-justify "left"
set-option -gq status-left-style "none"
set-option -gq status-left-length "80"
set-option -gq status-right-style "none"
set-option -gq status-right-length "80"

set-option -gq status-left "#[bg=colour250,fg=colour237] #S #[bg=colour253,fg=colour250,nobold,noitalics,nounderscore]"
set-option -gq status-right "#[bg=default,fg=colour252,nobold,nounderscore,noitalics]#[bg=colour252,fg=colour237] %Y-%m-%d  %H:%M #[bg=colour252,fg=colour250,nobold,noitalics,nounderscore]#[bg=colour250,fg=colour237] #h #{tmux_mode_indicator}"

# --- Pane borders ---
set-option -gq pane-border-style "fg=#d0d7de"
set-option -gq pane-active-border-style "fg=#b58900"
set-option -gq display-panes-active-colour "colour237"
set-option -gq display-panes-colour "colour252"

# --- Active pane background ---
set-option -gq window-style "bg=default"
set-option -gq window-active-style "bg=#f6f8fa"

# --- Messages ---
set-option -gq message-style "bg=colour252,fg=colour237"
set-option -gq message-command-style "bg=colour250,fg=colour237"

# --- Window status ---
set-window-option -gq window-status-style "bg=default,fg=colour252"
set-window-option -gq window-status-activity-style "bg=colour252,fg=colour237"
set-window-option -gq window-status-current-style "bg=default,fg=colour252"
set-window-option -gq window-status-bell-style "bg=colour167,fg=colour253"
set-window-option -gq window-status-separator ""

# --- Reusable format fragments ---
# Active tab color: zoomed (red) > default (yellow) — no claude-waiting here
set-option -gq @tab-color "#{?window_zoomed_flag,colour167,colour214}"

# Inactive tab color: claude-waiting (blue) > default (light grey)
set-option -gq @inactive-tab-color "#{?@claude-waiting,colour109,colour253}"

# Claude waiting indicator (shown only when @claude-waiting is set)
set-option -gq @claude-indicator "#{?@claude-waiting, ●,}"

# Pane count as (N) suffix (shown only when >1 pane)
set-option -gq @pane-dots "#{?#{>:#{window_panes},1}, (#{window_panes}),}"

# Trailing powerline separator: bg adapts to whether this is the last window
set-option -gq @tab-end "#{?window_end_flag,#[bg=default],#[bg=colour253]}"

# --- Window tab formats ---
# Active window: zoom-aware bg color + pane dots
set-window-option -gq window-status-current-format "\
#[bg=#{E:@tab-color},fg=colour253,nobold,noitalics,nounderscore]\
#[bg=#{E:@tab-color},fg=colour237] #I \
#[bg=#{E:@tab-color},fg=colour237,bold] #W#{E:@pane-dots} \
#{E:@tab-end}#[fg=#{E:@tab-color},nobold,noitalics,nounderscore]"

# Inactive window: light grey bg, blue when claude is waiting + indicator
set-window-option -gq window-status-format "\
#[bg=#{E:@inactive-tab-color},fg=colour253,noitalics]\
#[bg=#{E:@inactive-tab-color},fg=colour237] #I \
#[bg=#{E:@inactive-tab-color},fg=colour237] #W#{E:@claude-indicator}#{E:@pane-dots} \
#{E:@tab-end}#[fg=#{E:@inactive-tab-color},noitalics]"

# --- Clock ---
set-window-option -gq clock-mode-colour "colour237"
